[project]
name = "gamified-trader"
version = "0.1.0"
description = "Gamifiziertes Trading-Lernspiel mit historischen Kursdaten."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.6.0",
    "nicegui>=3.17.1",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "yfinance>=1.7.0",
]

[project.scripts]
gt = "app.cli:main"

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.6",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1",
    "pytest-timeout>=2.4",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# --- Quality gate numbers live here (see AGENTS.md §5.4) ---

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C90", "PT", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["src", "tests", ".claude/hooks"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
xfail_strict = true
session_timeout = 60

[tool.coverage.run]
branch = true
source = ["src", ".claude/hooks"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']
